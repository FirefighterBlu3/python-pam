name: Update CI requirements

on:
  push:
    branches: [main]
    paths:
      - .github/requirements-ci.in
      - .github/requirements-update-ci.in
      - .github/requirements-update-ci.txt
      - .github/workflows/update-ci-requirements.yml
      - poetry.lock
      - pyproject.toml
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: python -m pip install --require-hashes -r .github/requirements-update-ci.txt

      - name: Sync tox pin from poetry.lock and compile hashes
        run: |
          set -euo pipefail
          python <<'PY'
          import pathlib
          import re
          import tomllib

          lock = tomllib.loads(pathlib.Path("poetry.lock").read_text(encoding="utf-8"))
          tox_ver = next(p["version"] for p in lock["package"] if p["name"] == "tox")

          in_path = pathlib.Path(".github/requirements-ci.in")
          text = in_path.read_text(encoding="utf-8")
          updated, n = re.subn(r"^tox==.*$", f"tox=={tox_ver}", text, count=1, flags=re.M)
          if n != 1:
              raise SystemExit("could not update tox== pin in requirements-ci.in")
          in_path.write_text(updated, encoding="utf-8")
          print(f"Synced tox=={tox_ver} from poetry.lock")
          PY

          python -m piptools compile \
            --generate-hashes \
            --allow-unsafe \
            --output-file=.github/requirements-ci.txt \
            .github/requirements-ci.in

          if [[ ! -s .github/requirements-ci.txt ]]; then
            echo "requirements-ci.txt is empty after compile" >&2
            exit 1
          fi

      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "**chore** refresh hashed CI requirements"
          file_pattern: |
            .github/requirements-ci.in
            .github/requirements-ci.txt
